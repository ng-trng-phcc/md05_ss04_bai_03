name: rikkei-ss04-storex03

services:
  backend:
    image: storex-backend:v3
    pull_policy: never
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:?DB_HOST is required}:5432/${DB_NAME:?DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:?DB_PASS is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - storex-net

  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - storex-net

networks:
  storex-net:
    name: storex-net
    driver: bridge

volumes:
  postgres-data:

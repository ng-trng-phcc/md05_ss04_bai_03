spring.application.name=storex-connectivity-fixture-v3
server.port=8080
spring.datasource.hikari.pool-name=StoreXPool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
